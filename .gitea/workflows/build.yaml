name: Svelte Website build & push.
run-name: ${{ github.actor }} is building the website.
on:
  push:
    branches:
      - 'svelte-stable'
jobs:
  build:
    name: 'Building the website'
    runs-on: ubuntu-latest
    steps:
      - name: 'Build:checkout'
        uses: actions/checkout@v7.0.1
      - name: Set up docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          github-token: '' # Public GitHub releases do not accept the Gitea job token.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: git.projectsegfau.lt
          username: midou
          password: ${{ secrets.ACCESS_TOKEN }}
      - name: 'Build:dockerimage'
        uses: docker/build-push-action@v7.4.0
        env:
          ACTIONS_RUNTIME_TOKEN: '' # Workaround to some bug specific to gitea actions.
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false' # Gitea does not provide GitHub's artifact service.
        with:
          tags: git.projectsegfau.lt/midou/midou36o.github.io:latest
          context: '.'
          file: ./Dockerfile
          push: true
